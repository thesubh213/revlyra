name: Bug report
description: Report something that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details below —
        one issue per report keeps triage fast.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Include the exact CLI command or HTTP request if possible.
      placeholder: |
        1. `npx revlyra init`
        2. POST /v1/reviews/analyze with …
        3. Expected `score < 0.5`, got …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revlyra version
      description: Output of `revlyra --version` (or the package version from package.json).
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js 24 LTS
        - Node.js 22.13+
        - Docker image
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Store backend
      options:
        - SQLite (node:sqlite)
        - PostgreSQL
        - Not applicable
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or JSON output
      description: Redact tenant identifiers, reviewer HMACs, and API keys first.
      render: shell
    validations:
      required: false
